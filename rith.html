<style>
    body {

<body>

<header>
    <h1>🌀 RITH</h1>
    <p style="font-size:10px;color:#888;">PIPELINE4 · Algorithmus · Echt</p>
</header>

<div class="wert" id="rithWert">0</div>

<div class="desc" id="rithDesc">
    <b>RITH-WERT:</b><br>
    Wird dynamisch aus der Segmentmatrix berechnet.<br><br>
    RAW → STRUCTURE → VECTOR → FUSION
</div>

<footer>⚖️ EVO-GEOLEGAL · iki1uc ©</footer>

<script>
// ============================================================
// NEUE RITH-ENGINE · echte Berechnung (0–4)
// ============================================================

// Segmentmatrix (aus deiner 3hoch3 / 8→9-Norm)
const segs = [
    "◉ → 3 → 9 → ◎ → 81 → 3 ↺",
    "◉ → 9 → ◎ → 81 → ◆ → △ → ▣",
    "3 → 9 → 81 → ◆ → 756 → △ → 27 → ▣ → 3",
    "◎ → 81 → ◆ → △",
    "81 → ◆ → △ → 27",
    "756 → △ → 27 → ▣",
    "3 → ◎ → 27",
    "9 → 81 → ▣",
    "◆ → 756 → △"
];

// Segment-Parser
function parse(seg) {
    const hasLoop = seg.includes("↺");
    const clean = seg.replace("↺","").trim();
    const tokens = clean.split("→").map(t => t.trim());
    const nodes = tokens.length;
    const edges = nodes - 1;
    const closed = hasLoop || tokens[0] === tokens[nodes-1];
    const norm89 = (edges === 8 && nodes === 9 && closed);
    return { nodes, edges, closed, norm89 };
}

// Matrix-Analyse
function analyze() {
    const parsed = segs.map(parse);
    return {
        total: parsed.length,
        closed: parsed.filter(s => s.closed).length,
        tauglich: parsed.filter(s => s.norm89).length
    };
}

// RITH-Berechnung
function calcRITH() {
    const stats = analyze();
    let rith = 0;

    // RAW
    if (stats.total > 0) rith++;
    else return 0;

    // STRUCTURE
    if (stats.closed > 0) rith++;
    else return rith;

    // VECTOR
    if (stats.tauglich > 0) rith++;
    else return rith;

    // FUSION
    if (stats.tauglich === stats.total) rith++;

    return rith;
}

// UI setzen
const rith = calcRITH();
document.getElementById("rithWert").textContent = rith;
document.getElementById("rithDesc").innerHTML =
    `<b>RITH-WERT:</b><br>${rith} von 4 Stufen erreicht.<br><br>
     RAW → STRUCTURE → VECTOR → FUSION`;

</script>
