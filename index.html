<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PIPELINE · Grundachse · iki1uc</title>

<style>
    body {
        background:#000;
        color:#0f0;
        font-family:Consolas, monospace;
        padding:20px;
    }
    h1 { color:#6cf; }
    pre {
        background:#111;
        padding:12px;
        border:1px solid #333;
        border-radius:6px;
        color:#0f0;
    }
    .block {
        margin-bottom:20px;
    }
</style>

<script type="module">
import {
    PIPELINE_3,
    PIPELINE_6,
    PIPELINE_9,
    PIPELINE_12,
    CONTINIUM_TRUTH,
    WHIRL,
    GATE,
    WLOCH
} from "./um.js";

// =========================
// CSV Loader
// =========================

async function loadCSV(name){
    const res = await fetch(name);
    const text = await res.text();
    return text.split("\n").map(r => r.split(","));
}

// =========================
// PIPELINE Start
// =========================

async function PIPELINE_START(){

    // Pipeline‑Daten laden
    const p3 = await loadCSV("3.csv");
    const p6 = await loadCSV("6.csv");
    const p9 = await loadCSV("9.csv");
    const p12 = await loadCSV("datei-inhalt-12.csv");

    // Achsen‑Bedeutung
    const achse8 = await loadCSV("achse-bedeutung-8.csv");
    const achse10 = await loadCSV("achse-bedeutung-10.csv");

    // Stufen / Aufgaben
    const stufe5 = await loadCSV("stufe-aufgabe-5.csv");

    // Modul‑IO
    const modul8 = await loadCSV("modul-io-8.csv");

    // Axiom‑Dreieck
    const axiom6 = await loadCSV("axiom-dreieck-6.csv");

    // Wahrheit
    const truth = CONTINIUM_TRUTH();

    // WHIRL erzeugen
    const whirl = WHIRL({ x: 9, y: 6, z: 3 });

    // GATE + WLOCH
    const gate = [GATE.ram(), GATE.cpu(), GATE.gpu()];
    const wloch = [WLOCH.tmp(), WLOCH.trans(), WLOCH.warb()];

    return {
        pipeline: {
            p3, p6, p9, p12
        },
        achsen: {
            achse8, achse10
        },
        stufen: stufe5,
        modul: modul8,
        axiom: axiom6,
        truth,
        whirl,
        gate,
        wloch
    };
}

// =========================
// UI
// =========================

window.onload = async () => {
    const out = await PIPELINE_START();
    document.getElementById("out").textContent =
        JSON.stringify(out, null, 2);
};
</script>

</head>

<body>

<h1>PIPELINE · Grundachse · iki1uc</h1>

<div class="block">
    <pre id="out">Lade PIPELINE…</pre>
</div>

</body>
</html>
