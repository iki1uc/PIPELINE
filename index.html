<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PIPELINE · Station 0 · QI/IQQ · REAL</title>

<style>
body{background:#000;color:#0ff;font-family:Consolas, monospace;padding:20px;}
h1,h2{color:#6cf;text-shadow:0 0 12px #6cf;}
section{background:#0b0b0b;border:1px solid #222;padding:15px;margin-bottom:20px;
        border-radius:8px;box-shadow:0 0 12px #004466;}
pre{background:#111;border:1px solid #333;padding:12px;white-space:pre-wrap;}
button{background:#111;color:#0ff;border:1px solid #0ff;padding:10px 20px;margin:5px;}
</style>

<script type="module">

import { QI } from "./QI.js";
import { coreScan } from "./coreScan.js";

import { P4 } from "./pipelineP4.js";
import { P0 } from "./pipelineP0.js";
import { P1 } from "./pipelineP1.js";
import { P2 } from "./pipelineP2.js";
import { Pe } from "./pipelinePe.js";

function out(msg){
    document.getElementById("out").innerText = msg;
}

// QI
window.qi_pipeline = () => out(JSON.stringify(QI.scan(P4.run(coreScan())), null, 2));
window.qi_master   = () => out(JSON.stringify(QI.scan(coreScan()), null, 2));
window.qi_respo    = () => out(JSON.stringify(QI.scan(coreScan().respo360), null, 2));
window.qi_os       = () => out(JSON.stringify(QI.scan({id:"OS",core:true,fn:true,stable:true}), null, 2));
window.qi_stage    = () => out(JSON.stringify(QI.scan({id:"STAGE",core:true,fn:true,ready:true}), null, 2));
window.qi_404      = () => out(JSON.stringify(QI.scan({id:"404",stable:false,fn:false}), null, 2));

// PIPELINE
window.p4_switch = () => out(JSON.stringify(P4.run(coreScan()), null, 2));
window.p0_switch = () => out(JSON.stringify(P0.run(coreScan()), null, 2));
window.p1_switch = () => out(JSON.stringify(P1.run(coreScan()), null, 2));
window.p2_switch = () => out(JSON.stringify(P2.run(coreScan()), null, 2));
window.pe_switch = () => out(JSON.stringify(Pe.run(coreScan()), null, 2));

</script>

</head>

<body>

<h1>PIPELINE · Station 0 · QI/I
