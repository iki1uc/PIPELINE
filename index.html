<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PIPELINE · Station 0 · QI/IQQ · REAL</title>

<style>
body{background:#000;color:#0ff;font-family:Consolas, monospace;padding:20px;}
h1,h2{color:#6cf;text-shadow:0 0 12px #6cf;}
section{background:#0b0b0b;border:1px solid #222;padding:15px;margin-bottom:20px;
        border-radius:8px;box-shadow:0 0 12px #004466;}
pre{background:#111;border:1px solid #333;padding:12px;white-space:pre-wrap;}
button{background:#111;color:#0ff;border:1px solid #0ff;padding:10px 20px;margin:5px;}
</style>

<script type="module">

import { QI } from "./QI.js";
import { coreScan } from "./coreScan.js";

import { P4 } from "./pipelineP4.js";
import { P0 } from "./pipelineP0.js";
import { P1 } from "./pipelineP1.js";
import { P2 } from "./pipelineP2.js";
import { Pe } from "./pipelinePe.js";

window.out = function(msg){
    document.getElementById("out").innerText = msg;
};

// QI
window.qi_pipeline = function(){
    out(JSON.stringify(QI.scan(P4.run(coreScan())), null, 2));
};

window.qi_master = function(){
    out(JSON.stringify(QI.scan(coreScan()), null, 2));
};

window.qi_respo = function(){
    out(JSON.stringify(QI.scan(coreScan().respo360), null, 2));
};

window.qi_os = function(){
    out(JSON.stringify(QI.scan({id:"OS",core:true,fn:true,stable:true}), null, 2));
};

window.qi_stage = function(){
    out(JSON.stringify(QI.scan({id:"STAGE",core:true,fn:true,ready:true}), null, 2));
};

window.qi_404 = function(){
    out(JSON.stringify(QI.scan({id:"404",stable:false,fn:false}), null, 2));
};

// PIPELINE
window.p4_switch = function(){
    out(JSON.stringify(P4.run(coreScan()), null, 2));
};

window.p0_switch = function(){
    out(JSON.stringify(P0.run(coreScan()), null, 2));
};

window.p1_switch = function(){
    out(JSON.stringify(P1.run(coreScan()), null, 2));
};

window.p2_switch = function(){
    out(JSON.stringify(P2.run(coreScan()), null, 2));
};

window.pe_switch = function(){
    out(JSON.stringify(Pe.run(coreScan()), null, 2));
};

</script>

</head>

<body>

<h1>PIPELINE · Station 0 · QI/IQQ · REAL</h1>

<section>
<h2>QI / IQQ</h2>
<button onclick="qi_pipeline()">QI · PIPELINE</button>
<button onclick="qi_master()">QI · MASTER-KERN</button>
<button onclick="qi_respo()">QI · RESPO</button>
<button onclick="qi_os()">QI · OS</button>
<button onclick="qi_stage()">QI · STAGE</button>
<button onclick="qi_404()">QI · 404</button>
<pre id="out">Bereit…</pre>
</section>

<section>
<h2>PIPELINE</h2>
<button onclick="p4_switch()">P4 · start</button>
<button onclick="p0_switch()">P0 · wake</button>
<button onclick="p1_switch()">P1 · melt</button>
<button onclick="p2_switch()">P2 · merge</button>
<button onclick="pe_switch()">Pe · finalize</button>
</section>

</body>
</html>
